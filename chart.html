const ITER = 600000;
function b64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function decryptPayload(password, payload) {
  const raw = b64(payload), salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
  return new TextDecoder().decode(plain);
}
async function openPage(pw, remember) {
  const html = await decryptPayload(pw, PAYLOAD);
  if (remember) { try { localStorage.setItem("pg_pw_" + location.pathname.replace(/[^/]*$/, ""), pw); } catch (e) {} }
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg"); msg.textContent = "확인 중...";

});
(async () => {

})();
